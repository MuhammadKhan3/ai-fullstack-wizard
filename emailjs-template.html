<div style="font-family: Arial, Helvetica, sans-serif; max-width: 560px; margin: 0 auto; color: #1f2937;">
  <h2 style="color: #0ea5e9; margin-bottom: 4px;">New message from your portfolio</h2>
  <p style="margin-top: 0; color: #6b7280;">Sent via the Get In Touch form</p>

  <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
    <tr>
      <td style="padding: 8px 0; width: 90px; color: #6b7280;">From</td>
      <td style="padding: 8px 0;"><strong>{{name}}</strong> &lt;{{email}}&gt;</td>
    </tr>
    <tr>
      <td style="padding: 8px 0; color: #6b7280;">Subject</td>
      <td style="padding: 8px 0;">{{subject}}</td>
    </tr>
  </table>

  <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
    <p style="margin: 0; white-space: pre-wrap;">{{message}}</p>
  </div>

  <!-- Meeting Request Details - blank when this was a plain message rather than a slot request -->
  <div style="background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 16px;">
    <p style="margin: 0 0 8px; font-weight: bold; color: #0369a1;">Meeting Request Details</p>
    <table style="width: 100%; border-collapse: collapse;">
      <tr>
        <td style="padding: 4px 0; width: 90px; color: #6b7280;">Date</td>
        <td style="padding: 4px 0;">{{meeting_date}}</td>
      </tr>
      <tr>
        <td style="padding: 4px 0; color: #6b7280;">Time</td>
        <td style="padding: 4px 0;">{{meeting_time}}</td>
      </tr>
      <tr>
        <td style="padding: 4px 0; color: #6b7280;">Timezone</td>
        <td style="padding: 4px 0;">{{meeting_timezone}}</td>
      </tr>
    </table>
  </div>
</div>
